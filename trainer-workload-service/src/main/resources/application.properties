spring.application.name=trainer-workload-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.ratelimiter.instances.trainer-workload-service.limit-for-period=5
resilience4j.ratelimiter.instances.trainer-workload-service.limit-refresh-period=1m
resilience4j.ratelimiter.instances.trainer-workload-service.timeout-duration=0s
