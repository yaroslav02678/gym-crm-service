spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,prometheus,metrics

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] %-5level %logger{36} - %msg%n

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.application.name=gym-service

resilience4j.circuitbreaker.instances.trainer-workload-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.trainer-workload-service.slidingWindowSize=10
server.port=8080

spring.datasource.url=jdbc:h2:mem:gymdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.ratelimiter.instances.trainer-workload-service.limit-for-period=5
resilience4j.ratelimiter.instances.trainer-workload-service.limit-refresh-period=1m
resilience4j.ratelimiter.instances.trainer-workload-service.timeout-duration=0s

spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

app.queue.name=trainer-workload-queue